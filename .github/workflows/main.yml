name: CI/CD Pipeline Biblioteca

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Construir entorno e instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Entorno construido correctamente."

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Preparar entorno de pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar Pruebas Automatizadas (pytest)
        run: |
          pytest -v -s

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulación de Despliegue en PaaS
        run: |
          echo "Generación de imagen de contenedor DOcker"
          echo "Despliegue de archivos estáticos y plantillas Jinja2 para render"
          echo "Despliegue Exitoso"
          echo "Sistema de Biblioteca disponible para los usuarios"