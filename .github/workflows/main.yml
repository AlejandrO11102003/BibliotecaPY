name: CI/CD Pipeline Biblioteca

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar Pruebas Automatizadas (pytest)
        run: |
          pytest test_app.py

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Simulación de Despliegue en PaaS
        run: |
          echo "Generación de imagen de contenedor..."
          echo "Despliegue de archivos estáticos y plantillas Jinja2..."
          echo "Despliegue Simulado Exitoso"
          echo "Sistema de Biblioteca disponible para los usuarios"